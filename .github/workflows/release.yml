name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:

jobs:
  build:
    name: Build distribution 📦
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-clickhouse-backend
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - uses: actions/checkout@v4
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Publish the GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      # `dist/` contains the built packages, and the sigstore-produced
      # signatures and certificates. The release already exists when it was
      # drafted on GitHub, which creates the tag itself; a tag pushed from a
      # clone has no release yet, so create one from the changelog section.
      run: |
        awk -v heading="### ${TAG#v}" '
          $0 == heading { found = 1; next }
          found && /^### / { exit }
          found
        ' CHANGELOG.md > notes.md
        notes="--notes-file notes.md"
        [ -s notes.md ] || notes="--generate-notes"
        if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
          gh release upload "$TAG" dist/** --repo "$REPO"
        else
          gh release create "$TAG" dist/** --repo "$REPO" --title "$TAG" $notes
        fi
